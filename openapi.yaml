openapi: 3.0.3
info:
  title: MadHacks 2026 Campus Location API
  version: 2.0.0
  description: |
    Backend for the UW-Madison campus location app (Rust, axum, Lakebase/Postgres).

    **Flow.** Phones send their location (`POST /locations`, `/locations/batch`). The server
    matches each point to one of 87 campus buildings using a precomputed 2 m grid built from
    `assets/buildings_all.json` (points up to 15 m outside a building's walls are assigned to
    it, nearest wins) and stores `device_id, lat, lng, time, building`. Points matching no
    building are stored with `building = null`. Writes are buffered in memory and flushed every
    5 seconds or 100 points, so reads can lag a write by a few seconds.

    **Conventions.**
    - All timestamps are ISO-8601 *with* a timezone (`Z` or an offset). Naive timestamps are rejected.
    - Longitude is `lng` (not `long`).
    - Errors are JSON: `{"detail": "<message>"}`.
    - No authentication. Anyone who can reach the server can read and write.

    **Building names are slugs.** Buildings are identified by the lowercase snake_case `id` from
    `assets/buildings_all.json` (e.g. `memorial_union`, `morgridge_hall`, `morgridge_institute`).
    The server stores and returns this slug everywhere (`/heatmap`, `/buildings/counts`, the
    story path parameter). Display names exist only in the JSON file. See `BuildingSlug`.
servers:
  - url: http://localhost:8000/api/v1
    description: Local
  - url: https://{tunnel}.trycloudflare.com/api/v1
    description: cloudflared quick tunnel
    variables:
      tunnel: { default: example }

tags:
  - name: Ingest
    description: Phones send locations here
  - name: Buildings
    description: Live building counts, stories and baseline predictions
  - name: Heatmap
    description: Read stored points back
  - name: Ops
    description: Health

paths:
  /locations:
    post:
      tags: [Ingest]
      operationId: postLocation
      summary: Submit one location point
      description: >
        The building is derived from `lat`/`lng` (and `accuracy`, if sent). Returns 202 once the
        point is buffered, before it reaches the database.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationIn' }
            examples:
              minimal:
                summary: Required fields only
                value: { lat: 43.07287, lng: -89.40664, timestamp: "2026-11-14T22:34:00Z" }
              full:
                value:
                  lat: 43.07287
                  lng: -89.40664
                  timestamp: "2026-11-14T22:34:00Z"
                  device_id: ios-7f3a
                  accuracy: 8.0
      responses:
        '202':
          description: Accepted (buffered)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accepted' }
              example: { accepted: 1 }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /locations/batch:
    post:
      tags: [Ingest]
      operationId: postLocationsBatch
      summary: Submit 1-500 location points
      description: 'All-or-nothing validation: one invalid point rejects the whole batch.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchIn' }
            example:
              points:
                - { lat: 43.07287, lng: -89.40664, timestamp: "2026-11-14T22:34:00Z", device_id: ios-7f3a }
                - { lat: 43.07390, lng: -89.39874, timestamp: "2026-11-14T22:36:00Z", device_id: ios-7f3a }
      responses:
        '202':
          description: Accepted (buffered)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accepted' }
              example: { accepted: 2 }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /buildings/counts:
    get:
      tags: [Buildings]
      operationId: getBuildingCounts
      summary: People per building right now
      description: |
        Counts stored points from the **last 2 minutes** (up to now; future-dated points are ignored), grouped by building. Devices report on
        the even minute, so each point is treated as one person. Every building is listed, with
        `0` when empty. Points matching no building are not counted. Counts are recomputed on
        every request and lag by up to the 5 s write-buffer flush.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildingCounts' }
        '500': { $ref: '#/components/responses/DatabaseError' }

  /buildings/{building}/story:
    get:
      tags: [Buildings]
      operationId: getBuildingStory
      summary: Activity story for one building
      description: |
        Compares the number of location rows (`observations`) near a building at a campus-local
        time with the same time on earlier matching weekdays and on the other days of the current week. Aggregation
        runs in Databricks SQL; the narrative is generated statistically, or by Databricks
        `ai_query` when an AI endpoint is configured (`story_source` says which).

        Requires `DATABRICKS_HOST`, `DATABRICKS_TOKEN`, `DATABRICKS_WAREHOUSE_ID` and
        `DATABRICKS_CATALOG`; otherwise 503. `device_id` is not used: every row counts, including
        repeat reports from one device, so this is an observation count, not unique people or
        occupancy. Days with fewer than `STORY_MIN_OBSERVATIONS` rows (falls back to the old
        `STORY_MIN_DEVICES`, default 5) are `suppressed` and excluded from averages.
      parameters:
        - name: building
          in: path
          required: true
          description: Building slug as stored, e.g. `morgridge_hall`.
          schema: { type: string, minLength: 1, maxLength: 256 }
          example: morgridge_hall
        - name: date
          in: query
          description: Local calendar day `YYYY-MM-DD`. If `weekday` is also given they must agree. Cannot be in the future.
          schema: { type: string, format: date }
        - name: weekday
          in: query
          description: The most recent such weekday in the campus timezone (case-insensitive).
          schema: { type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday] }
        - name: time
          in: query
          description: Local wall-clock time `HH:MM`. Defaults to the current campus-local time. Must have already occurred on the selected day.
          schema: { type: string, pattern: '^\d{2}:\d{2}$', example: "14:30" }
        - name: weeks
          in: query
          description: Number of preceding matching weekdays to compare against.
          schema: { type: integer, minimum: 2, maximum: 12, default: 8 }
        - name: window_minutes
          in: query
          description: Minutes either side of the requested clock time.
          schema: { type: integer, minimum: 5, maximum: 60, default: 15 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildingStory' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502':
          description: Databricks query failed or returned no/invalid rows (details in server logs)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Databricks storytelling not configured or client could not initialise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /buildings/{building}/prediction:
    get:
      tags: [Buildings]
      operationId: getBuildingPrediction
      summary: Typical activity for a building at a future (or past) time
      description: |
        A **descriptive baseline**, not an ML forecast or occupancy count. Takes the number of
        location rows (`observations`, `device_id` is not used) near the building at the same
        campus-local time on completed previous matching weekdays and averages them. Days that
        are missing or below `STORY_MIN_OBSERVATIONS` rows are omitted, never counted as zero. With at least four
        usable days an IQR rule drops unusually high or low days before computing the mean and
        the 25th-75th percentile range. `typical_p25`/`typical_p75` are the observed spread, not
        a confidence interval.

        With no `date`/`weekday`, the target is the current campus-local day. `weekday` selects
        the next such weekday. A past `date` is allowed for backtesting.

        Requires the same Databricks settings as the story endpoint; otherwise 503.
      parameters:
        - name: building
          in: path
          required: true
          description: Building slug as stored, e.g. `morgridge_hall`.
          schema: { type: string, minLength: 1, maxLength: 256 }
          example: morgridge_hall
        - name: date
          in: query
          description: Target local calendar day `YYYY-MM-DD`. Must agree with `weekday` if both are given.
          schema: { type: string, format: date }
        - name: weekday
          in: query
          description: The next such weekday in the campus timezone (case-insensitive, full or 3-letter).
          schema: { type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday] }
        - name: time
          in: query
          description: Campus-local 24-hour `HH:MM`. Defaults to the current campus-local time.
          schema: { type: string, pattern: '^\d{2}:\d{2}$', example: "14:30" }
        - name: weeks
          in: query
          description: Completed previous matching weekdays to inspect.
          schema: { type: integer, minimum: 3, maximum: 12, default: 8 }
        - name: window_minutes
          in: query
          description: Minutes either side of the requested clock time.
          schema: { type: integer, minimum: 5, maximum: 60, default: 15 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildingPrediction' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502':
          description: Databricks query failed or returned an invalid result (details in server logs)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Databricks prediction not configured or client unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /heatmap:
    get:
      tags: [Heatmap]
      operationId: getHeatmap
      summary: Raw location points in [start, end)
      description: Points grouped by their UTC timestamp, keys in ascending order.
      parameters:
        - $ref: '#/components/parameters/start'
        - $ref: '#/components/parameters/end'
        - $ref: '#/components/parameters/bbox'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeatmapOut' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/DatabaseError' }

  /heatmap/broad:
    get:
      tags: [Heatmap]
      operationId: getHeatmapBroad
      summary: Broad (hourly) dataset in [start, end)
      description: >
        Reads `location_events_broad`. The server no longer writes this table; it only returns
        whatever other jobs have put there.
      parameters:
        - $ref: '#/components/parameters/start'
        - $ref: '#/components/parameters/end'
        - $ref: '#/components/parameters/bbox'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeatmapOut' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/DatabaseError' }

  /health:
    get:
      tags: [Ops]
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: Always 200; check `store_ok` for database reachability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, store_ok: true }

components:
  parameters:
    start:
      name: start
      in: query
      required: true
      description: Inclusive lower bound, ISO-8601 with timezone.
      schema: { type: string, format: date-time }
      example: "2026-11-14T00:00:00Z"
    end:
      name: end
      in: query
      required: true
      description: Exclusive upper bound, ISO-8601 with timezone. Must be after `start`.
      schema: { type: string, format: date-time }
      example: "2026-11-15T00:00:00Z"
    bbox:
      name: bbox
      in: query
      description: Filter `minLng,minLat,maxLng,maxLat`. Valid lat/lng ranges, min <= max.
      schema: { type: string }
      example: "-89.43,43.06,-89.38,43.09"
    limit:
      name: limit
      in: query
      description: Maximum points returned (oldest first).
      schema: { type: integer, minimum: 1, maximum: 200000, default: 50000 }

  responses:
    Unprocessable:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { detail: "end must be after start" }
    DatabaseError:
      description: Database error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { detail: database error }

  schemas:
    LocationIn:
      type: object
      required: [lat, lng, timestamp]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        timestamp:
          type: string
          format: date-time
          description: Must include a timezone (`Z` or offset). Stored as UTC.
          example: "2026-11-14T22:34:00Z"
        device_id:
          type: string
          maxLength: 128
          description: Optional. Trimmed; missing or blank becomes `"unknown"`.
        accuracy:
          type: number
          minimum: 0
          description: >
            Optional horizontal GPS accuracy in meters (alias `horizontal_accuracy`). A fix
            worse than 30 m is not matched to a building.
        building:
          type: string
          maxLength: 256
          description: >
            Optional. The server's grid lookup wins; a client-sent name is kept only when the
            grid finds no building. Blank is treated as absent.
    BatchIn:
      type: object
      required: [points]
      properties:
        points:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/LocationIn' }
    Accepted:
      type: object
      required: [accepted]
      properties:
        accepted: { type: integer, minimum: 1 }
    LatLng:
      type: object
      required: [lat, lng, building]
      properties:
        lat: { type: number }
        lng: { type: number }
        building: { type: string, nullable: true }
    HeatmapOut:
      type: object
      required: [start, end, count, data]
      properties:
        start: { type: string, format: date-time }
        end:   { type: string, format: date-time }
        count: { type: integer, description: Total points across all timestamps }
        data:
          type: object
          description: Map of UTC ISO-8601 timestamp to the points recorded at it, ascending.
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/LatLng' }
      example:
        start: "2026-11-14T00:00:00Z"
        end: "2026-11-15T00:00:00Z"
        count: 2
        data:
          "2026-11-14T22:34:00Z":
            - { lat: 43.07287, lng: -89.40664, building: morgridge_hall }
            - { lat: 43.074, lng: -89.39, building: null }
    BuildingCounts:
      type: object
      required: [window_minutes, total, counts]
      properties:
        window_minutes: { type: integer, example: 2 }
        total:          { type: integer, description: Sum of all counts }
        counts:
          type: object
          description: Building slug to number of people. Always contains all 87 buildings.
          additionalProperties: { type: integer, minimum: 0 }
      example:
        window_minutes: 2
        total: 15
        counts:
          memorial_union: 12
          bascom_hall: 3
          chemistry_building: 0
    DayActivity:
      type: object
      required: [date, weekday, observations, reporting_devices, status]
      properties:
        date:    { type: string, format: date }
        weekday: { type: string }
        observations:
          type: integer
          nullable: true
          description: Count of `location_events` rows in the window. Null means no readings, not yet reached, or below the minimum (never treated as 0).
        reporting_devices:
          type: integer
          nullable: true
          deprecated: true
          description: Legacy alias for `observations` (kept for existing mobile clients). It is a row count, not distinct devices.
        status:
          type: string
          enum: [available, suppressed, no_data, future]
    BuildingStory:
      type: object
      properties:
        building:      { type: string }
        date:          { type: string, format: date, description: Selected local day }
        weekday:       { type: string }
        time_local:    { type: string, example: "14:30" }
        timezone:      { type: string, example: America/Chicago }
        window_minutes: { type: integer }
        metric:        { type: string, example: location_observations }
        current:       { $ref: '#/components/schemas/DayActivity' }
        historical_same_weekday:
          type: array
          items: { $ref: '#/components/schemas/DayActivity' }
        this_week:
          type: array
          description: Monday through Sunday of the selected week
          items: { $ref: '#/components/schemas/DayActivity' }
        weekday_average:
          type: number
          nullable: true
          description: Null unless at least 2 historical weekdays have data
        weekday_samples: { type: integer }
        difference_vs_weekday_average_pct:
          type: number
          nullable: true
        other_days_this_week_average:
          type: number
          nullable: true
        other_days_this_week_samples: { type: integer }
        difference_vs_other_days_pct:
          type: number
          nullable: true
        story:
          type: string
          description: One short sentence (at most 96 characters) for mobile display
        story_source:
          type: string
          enum: [databricks_sql, databricks_ai_query]
        methodology:
          type: string
          description: How the numbers are computed and what they do and do not mean
    LocationEvent:
      type: object
      description: >
        One row of `public.location_events` (Lakebase/Postgres), the table `/heatmap` reads and
        the ingest endpoints write. Owned by the DB team; the server never creates it.
      required: [id, latitude, longitude, time]
      properties:
        id:
          type: integer
          format: int64
          description: Identity column (`generated always`); never supplied on insert.
        device_id:
          type: string
          nullable: true
          description: >
            Nullable, but if present it must not be blank (check `length(btrim(device_id)) > 0`).
            The API stores `"unknown"` when a client sends none; the bulk CSV load stores NULL.
            Stories and predictions no longer use `device_id`, so NULL rows are counted normally.
        latitude:  { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        time:
          type: string
          format: date-time
          description: '`timestamptz`, returned in UTC. Defaults to `CURRENT_TIMESTAMP`.'
        building:
          type: string
          nullable: true
          description: >
            Nullable `text`. NULL when no building matched. A `BuildingSlug`.
      example:
        id: 963129
        device_id: null
        latitude: 43.078209
        longitude: -89.410181
        time: "2026-11-15T06:30:00Z"
        building: morgridge_institute
    FutureCsvRow:
      type: object
      description: >
        One line of `1_day_future_apicalls.csv` (162,128 rows, one per ping, 2026-11-14T23:58Z
        to 2026-11-15T23:58Z). Header: `lat,long,timestamp,building`. Note the CSV column is
        `long`; the API field is `lng`, and the table column is `longitude`. There is no
        `device_id`.
      required: [lat, long, timestamp, building]
      properties:
        lat:       { type: number, example: 43.078209 }
        long:      { type: number, example: -89.410181 }
        timestamp: { type: string, format: date-time, example: "2026-11-15T06:30:00Z" }
        building:  { $ref: '#/components/schemas/BuildingSlug' }
    BuildingSlug:
      type: string
      description: >
        Lowercase snake_case building id (the `id` field in `assets/buildings_all.json`; also what the
        bulk CSV load uses). 87 distinct values, e.g.
        `ebling_library`, `kohl_center`, `memorial_union`, `morgridge_hall`,
        `morgridge_institute`, `union_south`, `van_hise`. Morgridge has two buildings: the
        institute (3,382 pings) and the hall (1,012).
      pattern: '^[a-z0-9_]+$'
      example: morgridge_institute
    HistoricalObservation:
      type: object
      required: [date, weekday, observations, reporting_devices, status, excluded_as_outlier, used_for_prediction]
      properties:
        date:    { type: string, format: date }
        weekday: { type: string, example: Saturday }
        observations:
          type: integer
          nullable: true
          description: Row count for that day's window. Null when `status` is not `available`.
        reporting_devices:
          type: integer
          nullable: true
          deprecated: true
          description: Legacy alias for `observations`.
        status:  { type: string, enum: [available, suppressed, no_data] }
        excluded_as_outlier: { type: boolean, description: Dropped by the IQR rule }
        used_for_prediction: { type: boolean }
    PredictionEstimate:
      type: object
      required: [status, reliability]
      properties:
        status: { type: string, enum: [available, insufficient_history] }
        expected_observations: { type: number, nullable: true, description: Mean row count of the used days }
        rounded_observations:  { type: integer, nullable: true }
        expected_reporting_devices: { type: number, nullable: true, deprecated: true, description: Legacy alias for `expected_observations` }
        rounded_reporting_devices:  { type: integer, nullable: true, deprecated: true, description: Legacy alias for `rounded_observations` }
        typical_p25: { type: number, nullable: true, description: Observed 25th percentile, not a prediction interval }
        typical_p75: { type: number, nullable: true, description: Observed 75th percentile, not a prediction interval }
        reliability:
          type: string
          enum: [low, moderate, high, insufficient]
          description: Heuristic from sample size and variability.
    BuildingPrediction:
      type: object
      required: [building, target_date, weekday, time_local, timezone, window_minutes, metric, method, prediction, samples_inspected, samples_used, outliers_excluded, historical_samples, summary, source, methodology]
      properties:
        building:       { type: string, example: morgridge_hall }
        target_date:    { type: string, format: date }
        weekday:        { type: string }
        time_local:     { type: string, example: "14:30" }
        timezone:       { type: string, example: America/Chicago }
        window_minutes: { type: integer }
        metric:         { type: string, example: location_observations }
        method:         { type: string, example: robust_same_weekday_mean }
        prediction:     { $ref: '#/components/schemas/PredictionEstimate' }
        samples_inspected: { type: integer }
        samples_used:      { type: integer }
        outliers_excluded: { type: integer }
        historical_samples:
          type: array
          items: { $ref: '#/components/schemas/HistoricalObservation' }
        summary: { type: string, description: Short human-readable sentence }
        source:  { type: string, example: databricks_sql }
        methodology: { type: string }
    Health:
      type: object
      required: [status, store_ok]
      properties:
        status:   { type: string, example: ok }
        store_ok: { type: boolean, description: False if the database cannot be reached }
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
