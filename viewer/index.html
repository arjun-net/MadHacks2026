<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Pulse — Heatmap Viewer</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Analysis dock (top center): layer + data-analysis tools -->
  <section class="glass adock" role="toolbar" aria-label="Analysis tools">
    <button id="toggle-heat" class="tool-btn active" title="Density heatmap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4.4 0 7-2.9 7-6.6 0-3.1-2.2-5.3-3.8-7.4C13.6 5.9 13 4 13 2c-2.6 1.4-4 3.6-4 6 0 .9.2 1.7.5 2.4C8 9.6 7 8.4 7 7c-1.3 1.6-2 3.9-2 6.4C5 19.1 7.6 22 12 22z"/></svg>
    </button>
    <button id="toggle-paths" class="tool-btn" title="Agent path overlays">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M7 18c6 0 4-12 10-12"/><path d="M5 17v-4c0-2 1-3 3-3h4"/></svg>
    </button>
    <span class="adock-sep"></span>
    <button id="tool-congestion" class="tool-btn" title="Congestion analysis (mock)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
    </button>
    <button id="tool-peaks" class="tool-btn" title="Peak times by place (mock)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    </button>
    <button id="tool-hotspots" class="tool-btn" title="Busiest places (mock)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
    </button>
    <span class="adock-sep"></span>
    <label class="tool-btn" for="csv-input" title="Load simulation CSV">
      <input type="file" id="csv-input" accept=".csv" hidden />
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
    </label>
  </section>

  <!-- Toast (load status / messages) -->
  <div id="status" class="toast" hidden></div>

  <!-- Agent detail panel -->
  <aside id="agent-panel" class="glass agent-panel" hidden>
    <button id="agent-close" class="panel-close" title="Close">×</button>
    <div id="agent-panel-title" class="panel-title">Agent</div>
    <div id="agent-panel-body" class="panel-body"></div>
  </aside>

  <!-- Timeline dock (bottom left) -->
  <section class="glass dock">
    <div class="dock-row">
      <button id="play-btn" class="icon-btn" title="Play / Pause">▶</button>
      <span id="time-label" class="time-label">--:--</span>
      <input type="range" id="time-slider" min="0" max="719" value="0" step="1" disabled />
      <label class="speed-label">
        <select id="speed-select">
          <option value="250">0.25×</option>
          <option value="100" selected>1×</option>
          <option value="50">2×</option>
          <option value="25">4×</option>
        </select>
      </label>
    </div>
    <div class="ticks" id="ticks">
      <span>--</span><span>--</span><span>--</span><span>--</span><span>--</span>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
