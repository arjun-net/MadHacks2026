<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Campus Pulse — Geofence &amp; Walkability Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="map"></div>

  <header class="topbar glass">
    <div class="brand">
      <span class="pulse-dot"></span>
      <h1>Geofence Editor</h1>
      <span class="sub">vertices + walkability grid</span>
    </div>
    <div class="toggles">
      <button id="toggle-grid" class="toggle-btn active" title="Toggle walkability grid">Grid</button>
      <button id="toggle-geofence" class="toggle-btn active" title="Toggle geofence polygons &amp; vertices">Geofence</button>
    </div>
    <div class="top-actions">
      <span id="save-status" class="save-status"></span>
      <button id="btn-download" class="toggle-btn" title="Download edited buildings.json">Download</button>
      <button id="btn-save" class="upload-btn" title="Write changes to configs/buildings.json">Save to config</button>
    </div>
  </header>

  <aside class="dock glass">
    <div class="dock-title">buildings</div>
    <div id="bldg-list" class="bldg-list"></div>
  </aside>

  <aside class="panel glass" id="vertex-panel" hidden>
    <button id="vp-close" class="panel-close" title="Close">×</button>
    <div class="panel-title">vertex</div>
    <div class="panel-row"><span>building</span><b id="vp-bldg">—</b></div>
    <div class="panel-row"><span>index</span><b id="vp-index">—</b></div>
    <label class="field">lat
      <input id="vp-lat" type="number" step="0.00001" />
    </label>
    <label class="field">lng
      <input id="vp-lng" type="number" step="0.00001" />
    </label>
    <div class="panel-actions">
      <button id="vp-delete" class="btn danger">delete vertex</button>
    </div>
    <div class="panel-title" style="margin-top:14px">building</div>
    <div class="panel-row"><span>id</span><b id="vp-bid">—</b></div>
    <div class="panel-row"><span>type</span><b id="vp-type">—</b></div>
    <div class="panel-row"><span>vertices</span><b id="vp-count">—</b></div>
    <button id="vp-add" class="btn">add vertex (click map)</button>
    <div class="panel-note" id="vp-note"></div>
  </aside>

  <aside class="info glass">
    <div id="status" class="status">Drag a vertex to move it · the grid rebuilds automatically.</div>
    <div class="legend">
      <span class="legend-title">Walkability</span>
      <div class="legend-items">
        <span class="key"><i class="swatch blocked"></i>blocked (6 m cells)</span>
        <span class="key"><i class="swatch walkable"></i>walkable</span>
      </div>
    </div>
    <div class="legend">
      <span class="legend-title">Types</span>
      <div class="legend-items" id="type-legend"></div>
    </div>
  </aside>

  <script src="data.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
